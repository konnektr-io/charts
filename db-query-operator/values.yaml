replicaCount: 1

image:
  repository: ghcr.io/konnektr-io/db-query-operator
  tag: ""
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

terminationGracePeriodSeconds: 10

gvkPattern: "v1/ConfigMap"

# set to debug for more verbose logging
logLevel: "info"

# Optionally set the namespace for deployment
namespaceOverride: ""

# Validating admission webhook: rejects invalid DatabaseQueryResource specs
# (unparseable pollInterval, empty query, malformed template, missing Secret
# name) on create and update, instead of failing later during reconciliation.
webhook:
  enabled: true
  # failurePolicy of the ValidatingWebhookConfiguration. "Fail" rejects
  # DatabaseQueryResource writes while the webhook is unreachable, so an
  # unvalidated spec can never slip through unseen; "Ignore" lets writes through
  # when the webhook is down.
  failurePolicy: Fail
  # cert-manager (required when the webhook is enabled) issues the serving
  # certificate and injects the CA bundle. The chart creates a self-signed Issuer
  # by default; point issuerRef at an existing issuer to use that instead:
  #   certManager:
  #     issuerRef:
  #       name: my-issuer
  #       kind: ClusterIssuer
  certManager:
    issuerRef: {}
